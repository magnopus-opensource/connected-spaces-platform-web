      # Mitigation inserted by the setup-local-mcs action to add CORS headers for prototype service
      # file URLs.
      # Must come before the generic /(mag|oly)-<service>/ location, as nginx uses the first regex
      # location that matches.
      #
      # mag-prototype serves stored files (e.g. asset uploads) before its CORS middleware runs, so
      # they come back without Access-Control-Allow-Origin and browsers refuse to read them.
      # Add the header here. Hide the service's own header first so responses that already have one
      # (e.g. 404s) don't end up with two, which browsers also reject. Preflights are passed through
      # to the service, which already answers them correctly.
      location ~* ^/mag-prototype/files/(?<file_path>.*)$ {
        proxy_hide_header   Access-Control-Allow-Origin;
        add_header          Access-Control-Allow-Origin * always;

        # Same as the generic location
        proxy_pass          http://mag-prototype/mag-prototype/files/$file_path$is_args$args;
        proxy_http_version  1.1;
        proxy_set_header    Host                  $host:$server_port;
        proxy_set_header    X-Forwarded-Host      $host:$server_port;
        proxy_set_header    X-Forwarded-Proto     "http";
        proxy_set_header    X-Forwarded-For       $proxy_add_x_forwarded_for;
      }

# Make a release. Publishes the bindings (release and debug builds) as an npm package to
# GitHub Packages, then uploads the build artifacts to a GitHub release.
name: Make Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g., v0.0.1)'
        required: true
      release_name:
        description: 'Name of the release'
        required: true
      csp_tag:
        description: 'Tag of CSP to use for the release (e.g., v0.0.1)'
        required: true

permissions:
  contents: write

jobs:
  # Build the bindings
  build-bindings:
    uses: ./.github/workflows/build-bindings.yml
    with:
      csp_branch: ${{ inputs.csp_tag }}

  # Publish the bindings to GitHub Packages (npm). This runs before the GitHub release because a
  # published npm version can't be reused, whereas the release step can safely be re-run.
  publish-npm:
    needs: [build-bindings]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download bindings artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: CSP-WASM-Bindings-*
          path: npm-package

      # The release build goes at the package root and the debug build under debug/,
      # exposed as the "." and "./debug" entry points (see package.json.in).
      - name: Assemble package
        shell: bash
        working-directory: npm-package
        run: |
          set -eux
          unzip -o CSP-WASM-Bindings-release/CSP-WASM-Bindings-release.zip -d package
          unzip -o CSP-WASM-Bindings-debug/CSP-WASM-Bindings-debug.zip -d package/debug
          # The root package.json (from the release build) describes the whole package.
          rm package/debug/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@magnopus-opensource'

      - name: Set package version
        shell: bash
        working-directory: npm-package/package
        env:
          VERSION: ${{ github.event.inputs.version }}
        # Strip an optional leading "v" (e.g. v1.2.3 -> 1.2.3) to get a valid semver.
        run: npm version --no-git-tag-version --allow-same-version "${VERSION#v}"

      - name: Validate npm package
        working-directory: npm-package/package
        shell: bash
        run: |
          set -euxo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          test -n "$PACKAGE_NAME"
          test -n "$PACKAGE_VERSION"

          echo "Publishing ${PACKAGE_NAME}@${PACKAGE_VERSION}"

          # Every file listed in package.json "files" must be present, including the debug build.
          node -e "
            const fs = require('fs');
            const missing = require('./package.json').files.filter(f => !fs.existsSync(f));
            if (missing.length) { console.error('Missing package files:', missing); process.exit(1); }
          "

          npm pack --dry-run

      - name: Publish npm package
        working-directory: npm-package/package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: npm publish

  # Then make the release
  publish-release:
    needs: [build-bindings, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Fallback name for push events
          name: ${{ github.event.inputs.release_name }}
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          # Add the ** wildcard so it searches inside the subfolders too
          files: release-artifacts/**/*.zip
